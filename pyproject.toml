[project]
name = "grm"
version = "0.2.1"
description = "Manage git repositories"
authors = [
    {name = "Youngwoo Kim",email = "yw.sean.kim@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyjwt (>=2.10.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "typer (>=0.20.0,<0.21.0)",
    "pyperclip (>=1.11.0,<2.0.0)"
]

[project.scripts]
grm = "grm.cli:main"

[tool.poetry]
packages = [{include = "grm", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
